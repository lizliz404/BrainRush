<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Brain Rush</title>
  <desc id="desc">Social preview card for Brain Rush, a 60-second mental math and English word game.</desc>
  <defs>
